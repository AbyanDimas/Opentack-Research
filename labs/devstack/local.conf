[[local|localrc]]

# ==============================================================================
# DevStack Configuration - Controller / Single-Node with OVN
# Optimized for Low-Memory Virtual Machines (4GB - 8GB RAM)
# ==============================================================================

# Administrative Passwords
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=secret
RABBIT_PASSWORD=secret
SERVICE_PASSWORD=secret

# Target Host IP Address (Update with host management interface IP)
HOST_IP=192.168.101.142

# Branch selection (stable/2024.1 or master)
GIT_BASE=https://opendev.org
DEST=/opt/stack

# Worker concurrency limits (Critical for preventing OOM on 4GB RAM nodes)
API_WORKERS=2
CONDUCTOR_WORKERS=2

# Logging Configuration
LOGFILE=$DEST/logs/stack.sh.log
VERBOSE=True
LOG_COLOR=False

# ------------------------------------------------------------------------------
# Enabled Core Services
# ------------------------------------------------------------------------------
# Keystone (Identity)
enable_service key

# Glance (Image Service)
enable_service g-api
enable_service g-reg

# Nova (Compute Service)
enable_service n-api
enable_service n-cpu
enable_service n-cond
enable_service n-sch
enable_service placement-api

# OVN & Neutron (Software Defined Networking)
enable_plugin neutron https://opendev.org/openstack/neutron
enable_plugin ovn-octavia https://opendev.org/openstack/ovn-octavia

enable_service q-svc
enable_service ovn-northd
enable_service ovn-controller
enable_service q-ovn-metadata-agent

# Disable legacy LinuxBridge / OVS L2/L3 agents (Replaced by OVN)
disable_service q-agt
disable_service q-dhcp
disable_service q-l3

# Horizon Dashboard
enable_service horizon

# Network Topology settings
Q_USE_PROVIDERNET_FOR_PUBLIC=True
PHYSICAL_NETWORK=public
OVS_PHYSICAL_BRIDGE=br-ex
PUBLIC_INTERFACE=ens3
FLOATING_RANGE=192.168.101.0/24
PUBLIC_NETWORK_GATEWAY=192.168.101.1
