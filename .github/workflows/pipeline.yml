name: CI/CD Pipeline

on:
  push:
    branches:
      - pages
  pull_request:
    branches:
      - pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check Quality (Typos, Links & PR Title)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PR Title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\.-]+\))?:[[:space:]].+ ]]; then
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits format!"
            echo "Allowed prefixes: feat:, fix:, docs:, style:, refactor:, perf:, test:, build:, ci:, chore:, revert:"
            exit 1
          fi
          echo "PR title is valid."

      - name: Run Codespell (Typo Check)
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          check_hidden: false
          ignore_words_file: .codespellignore
          skip: "*.png,*.jpg,*.svg,*.min.js,*.lock,.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Internal Markdown Links
        run: |
          python3 scripts/check-links.py

  build:
    name: Build Jekyll Wiki
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/pages' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  release:
    name: Release Please
    needs: [lint]
    if: github.ref == 'refs/heads/pages' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          target-branch: pages

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, release]
    if: github.ref == 'refs/heads/pages' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site
        id: deployment
        uses: actions/deploy-pages@v4
